<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3PLACE - PixelArt Fixer</title><style>:root{--bg:#121214;--container-bg:#1a1a1e;--accent:#4aab48;--border:#2d2d34;--text:#e1e1e6;--text-muted:#a8a8b3}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:var(--bg);color:var(--text);margin:0;padding:40px 20px;display:flex;flex-direction:column;align-items:center}.wrapper{width:100%;max-width:500px;background-color:var(--container-bg);border:1px solid var(--border);border-radius:8px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,0.2)}.h1-title{font-size:20px;margin:0 0 4px 0;font-weight:600;color:var(--text)}.subtitle{font-size:13px;color:var(--text-muted);margin:0 0 24px 0}.drop-area{border:2px dashed var(--border);border-radius:6px;padding:32px 16px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin-bottom:20px}.drop-area:hover{border-color:var(--accent)}.drop-area p{margin:8px 0 0 0;font-size:14px;color:var(--text-muted)}.control-group{margin-bottom:20px}.control-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--text-muted)}input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer;margin:0}.preview-box{border:1px solid var(--border);background:#09090b;border-radius:6px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:280px;max-height:400px;margin-bottom:20px;overflow:hidden;position:relative;cursor:grab}.preview-box:active{cursor:grabbing}canvas{max-width:100%;max-height:100%;object-fit:contain;image-rendering:-moz-pixelated;image-rendering:-webkit-crisp-edges;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:center center;display:none}.btn{display:block;width:100%;background-color:var(--accent);color:#ffffff;border:none;padding:10px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box}.btn:hover{opacity:0.9}#fileInput{display:none}</style></head><body><div class="wrapper"><h1 class="h1-title">3PLACE PixelArt Fixer</h1><p class="subtitle">Convert any image to the exact 3PLACE voxel color palette.</p><div class="drop-area" id="dropArea"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><p>Drag & drop image or click to browse</p><input type="file" id="fileInput" accept="image/*"></div><div id="editorInterface" style="display:none"><div class="control-group"><div class="control-label"><span>Pixel Resolution (Width)</span><span id="resolutionValue">256px</span></div><input type="range" id="resolutionSlider" min="4" max="1024" value="256" step="4"></div><div class="preview-box" id="previewBox"><canvas id="outputCanvas"></canvas></div><button class="btn" id="downloadBtn">Download Image</button></div></div><script>const PALETTE=[{r:69,g:19,b:23},{r:124,g:26,b:33},{r:178,g:36,b:42},{r:227,g:61,b:56},{r:244,g:115,b:95},{r:255,g:171,b:154},{r:74,g:35,b:13},{r:125,g:60,b:18},{r:178,g:91,b:22},{r:229,g:130,b:29},{r:249,g:169,b:75},{r:255,g:208,b:160},{r:77,g:59,b:16},{r:128,g:99,b:22},{r:181,g:143,b:28},{r:226,g:184,b:41},{r:246,g:217,b:79},{r:253,g:240,b:166},{r:20,g:53,b:27},{r:31,g:90,b:40},{r:47,g:130,b:54},{r:74,g:171,b:72},{r:124,g:207,b:103},{r:188,g:234,b:162},{r:0,g:0,b:0},{r:43,g:43,b:49},{r:74,g:74,b:82},{r:107,g:107,b:115},{r:143,g:143,b:150},{r:181,g:181,b:186},{r:218,g:218,b:222},{r:255,g:255,b:255},{r:15,g:51,b:54},{r:22,g:87,b:92},{r:31,g:130,b:136},{r:47,g:173,b:178},{r:92,g:213,b:216},{r:171,g:239,b:237},{r:22,g:32,b:74},{r:21,g:56,b:125},{r:47,g:87,b:178},{r:68,g:121,b:222},{r:116,g:167,b:242},{r:177,g:211,b:251},{r:45,g:22,b:70},{r:76,g:36,b:120},{r:112,g:54,b:173},{r:148,g:85,b:216},{r:183,g:131,b:241},{r:220,g:186,b:251},{r:72,g:18,b:48},{r:124,g:28,b:80},{r:179,g:43,b:118},{r:226,g:72,b:156},{r:246,g:128,b:187},{r:255,g:184,b:217},{r:52,g:33,b:20},{r:91,g:58,b:34},{r:132,g:87,b:49},{r:171,g:122,b:75},{r:207,g:164,b:120},{r:237,g:205,b:166},{r:79,g:77,b:35},{r:138,g:132,b:73}];let sourceImg=null;const dropArea=document.getElementById('dropArea'),fileInput=document.getElementById('fileInput'),editorInterface=document.getElementById('editorInterface'),outputCanvas=document.getElementById('outputCanvas'),resolutionSlider=document.getElementById('resolutionSlider'),resolutionValue=document.getElementById('resolutionValue'),downloadBtn=document.getElementById('downloadBtn'),previewBox=document.getElementById('previewBox'),ctx=outputCanvas.getContext('2d');let scale=1,panning=!1,pointX=0,pointY=0,start={x:0,y:0};dropArea.addEventListener('click',()=>fileInput.click());dropArea.addEventListener('dragover',e=>e.preventDefault());dropArea.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)handleImageFile(e.dataTransfer.files)});fileInput.addEventListener('change',e=>{if(e.target.files.length)handleImageFile(e.target.files)});resolutionSlider.addEventListener('input',()=>{resolutionValue.textContent=resolutionSlider.value+'px';if(sourceImg)processPixelArt()});function handleImageFile(e){const t=new FileReader;t.onload=function(e){sourceImg=new Image;sourceImg.onload=function(){scale=1,pointX=0,pointY=0,updateTransform(),editorInterface.style.display='block',outputCanvas.style.display='block',processPixelArt()};sourceImg.src=e.target.result};t.readAsDataURL(e[0])}function processPixelArt(){const e=parseInt(resolutionSlider.value);let t=e,a=Math.round(e*(sourceImg.naturalHeight/sourceImg.naturalWidth));outputCanvas.width=t,outputCanvas.height=a;ctx.imageSmoothingEnabled=!1,ctx.mozImageSmoothingEnabled=!1,ctx.webkitImageSmoothingEnabled=!1;ctx.drawImage(sourceImg,0,0,t,a);const r=ctx.getImageData(0,0,t,a),n=r.data;for(let e=0;e<n.length;e+=4){let t=n[e],a=n[e+1],o=n[e+2],i=n[e+3];if(i<10)continue;let s=PALETTE,g=Infinity;for(let e of PALETTE){let i=Math.sqrt(Math.pow(t-e.r,2)+Math.pow(a-e.g,2)+Math.pow(o-e.b,2));i<g&&(g=i,s=e)}n[e]=s.r,n[e+1]=s.g,n[e+2]=s.b}ctx.putImageData(r,0,0)}function updateTransform(){outputCanvas.style.transform=`translate(${pointX}px, ${pointY}px) scale(${scale})`}previewBox.addEventListener('mousedown',e=>{e.preventDefault(),start={x:e.clientX-pointX,y:e.clientY-pointY},panning=!0});previewBox.addEventListener('mouseup',()=>panning=!1);previewBox.addEventListener('mouseleave',()=>panning=!1);previewBox.addEventListener('mousemove',e=>{panning&&(e.preventDefault(),pointX=e.clientX-start.x,pointY=e.clientY-start.y,updateTransform())});previewBox.addEventListener('wheel',e=>{e.preventDefault();let t=(e.wheelDelta?e.wheelDelta/120:e.detail?-e.detail/3:0)*0.2;scale=Math.min(Math.max(1,scale+t),30),updateTransform()});downloadBtn.addEventListener('click',()=>{const e=document.createElement('a');e.download='3place-pixelart.png',e.href=outputCanvas.toDataURL(),e.click()});</script></body></html>
